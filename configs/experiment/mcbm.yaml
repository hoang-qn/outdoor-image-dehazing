# Original RGB DehazeFormer-T baseline trained with online MCBM haze synthesis.
# Depth maps condition the synthetic haze generation only; they are not model inputs.
project: outdoor-image-dehazing
seed: 42

data:
  root: data
  depth_root: data/depth_maps
  train:
    dataset: RESIDE-6K-Outdoor
    split: train
    hazy_dir: hazy
    clear_dir: clear
  validation:
    dataset: RESIDE-6K-Outdoor
    split: val
    hazy_dir: hazy
    clear_dir: clear
  external_test:
    - dataset: O-HAZE
      hazy_dir: hazy
      clear_dir: clear
    - dataset: NH-HAZE
      hazy_dir: hazy
      clear_dir: clear
  num_workers: 4
  pin_memory: true

model:
  name: dehazeformer_t_mcbm
  use_depth: false
  initialization: random

training:
  epochs: 50
  batch_size: 16
  crop_size: 256
  optimizer: AdamW
  learning_rate: 0.0002
  weight_decay: 0.0001
  scheduler: cosine
  mixed_precision: true
  augmentation:
    horizontal_flip: true
    white_haze_density:
      enabled: false
    spatial_haze:
      enabled: false
    mcbm_haze:
      enabled: true
      map_root: data/MCBM
      beta_range: [0.2, 2.8]
      beta_map_scale_range: [0.5, 1.0]
      airlight_range: [0.25, 1.8]
      depth_scale: 2.0
  early_stopping:
    patience: 5

evaluation:
  metrics: [L1, PSNR, SSIM]
  image_range: [0, 1]
  ssim_window_size: 11
  gflops_reference_size: 256
  crop_border: 0
  save_visual_comparisons: true

output:
  root: runs
  experiment_name: dehazeformer_t_mcbm
