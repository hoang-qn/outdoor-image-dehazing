# M6 atmospheric consistency + online MCBM on ALL THREE training domains.
# Launcher prepares missing train-only depth maps/cache, then measures batch/worker throughput.
project: outdoor-image-dehazing
seed: 42

data:
  root: data
  depth_root: data/depth_maps
  image_cache_root: data/training_cache/m6_mcbm
  train:
    datasets:
      - dataset: RESIDE-6K-Outdoor
        split: train
      - dataset: NH-HAZE2
        split: train
      - dataset: HD-NH-HAZE
        split: train
  validation:
    datasets:
      - dataset: RESIDE-6K-Outdoor
        split: val
      - dataset: NH-HAZE2
        split: val
      - dataset: HD-NH-HAZE
        split: val
  external_test:
    - dataset: RESIDE-6K-Outdoor
      split: test
    - dataset: O-HAZE
    - dataset: NH-HAZE
  num_workers: 4
  prefetch_factor: 2
  # Full-resolution validation images can be huge; bound RAM and Windows pagefile use.
  validation_num_workers: 0
  validation_tile_size: 512
  validation_tile_overlap: 64
  pin_memory: true

model:
  name: dehazeformer_t_m6
  use_depth: false
  initialization: random

training:
  epochs: 50
  batch_size: 16  # Replaced in run-specific effective_config.yaml by measured tuning result.
  crop_size: 256
  optimizer: AdamW
  learning_rate: 0.0002
  weight_decay: 0.0001
  fused_optimizer: true
  cpu_threads: 4
  deterministic: false  # Seed remains 42; allow faster cuDNN algorithms, not bitwise replay.
  scheduler: cosine
  mixed_precision: true
  progress_interval: 20
  log_timing: true
  loss:
    type: l1
  physical_consistency_weight: 0.05
  sampling:
    strategy: shuffle
  augmentation:
    horizontal_flip: true
    white_haze_density:
      enabled: false
    mcbm_haze:
      enabled: true
      map_root: data/MCBM
      beta_range: [0.2, 2.8]
      beta_map_scale_range: [0.5, 1.0]
      airlight_range: [0.25, 1.8]
      depth_scale: 2.0
  early_stopping:
    patience: 0

evaluation:
  metrics: [L1, PSNR, SSIM]
  image_range: [0, 1]
  ssim_window_size: 11
  gflops_reference_size: 256
  crop_border: 0
  save_visual_comparisons: true

output:
  root: runs
  experiment_name: dehazeformer_t_m6_mcbm_full50
